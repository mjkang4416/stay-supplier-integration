spring.application.name=stay-supplier-integration

spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/stay_supplier?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:stay}
spring.datasource.password=${DB_PASSWORD:stay}

# schema.sql 을 기동 때마다 적용한다 (CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
