spring.application.name=stay-supplier-integration

spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/stay_supplier?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:stay}
spring.datasource.password=${DB_PASSWORD:stay}

# schema.sql 을 기동 때마다 적용한다 (CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 공급사 접속 설정. 새 공급사는 Supplier enum 값과 같은 이름으로 항목을 추가한다.
# 로컬에서는 두 공급사 모두 Mock Supplier(9090) 를 가리킨다.
supplier.endpoints.a.base-url=http://localhost:${MOCK_SUPPLIER_PORT:9090}
supplier.endpoints.a.api-key=${SUPPLIER_A_API_KEY:local-a-key}
supplier.endpoints.a.connect-timeout=1s
supplier.endpoints.a.response-timeout=3s
supplier.endpoints.b.base-url=http://localhost:${MOCK_SUPPLIER_PORT:9090}
supplier.endpoints.b.api-key=${SUPPLIER_B_API_KEY:local-b-key}
supplier.endpoints.b.connect-timeout=1s
supplier.endpoints.b.response-timeout=3s

# 매핑 갱신 잡(크론잡). 공급사 목록 호출이 일시 장애면 고정 간격으로 다시 시도하고, 그래도 실패하면 그 공급사만 건너뛴다.
# 직전 active 숙소의 절반 넘게 사라지는 델타는 공급사 쪽 장애로 보고 비활성화를 보류한다.
mapping.sync.retry-attempts=3
mapping.sync.retry-delay=30s
mapping.sync.max-disappear-ratio=0.5

# 웹 앱의 인메모리 매핑 로드. 기동 시 한 번 동기로 읽고, 크론잡(04:00)이 끝난 뒤 매일 04:30 에 다시 읽는다.
# 리로드가 실패하면 기존 인메모리를 유지하고 retry-delay 뒤 한 번 더 시도한다.
mapping.reload.cron=0 30 4 * * *
mapping.reload.zone=Asia/Seoul
mapping.reload.retry-delay=5m

# 통합 검색. 검색 재시도는 사용자가 기다리므로 연결 실패·5xx 만 즉시 1회 (타임아웃·429 는 없음)
search.max-nights=30
search.retry-attempts=1
search.retry-delay=200ms
